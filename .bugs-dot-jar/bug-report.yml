      comments:
        comment:
        - '#text': "<p>Created reviewboard <a href=\"https://reviews.apache.org/r/31363/diff/\"\
            \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\"\
            >https://reviews.apache.org/r/31363/diff/</a><br/>\n against branch origin/trunk</p>"
          '@author': junrao
          '@created': Tue, 24 Feb 2015 17:43:05 +0000
          '@id': '14335141'
        - '#text': "<p>There are actual two problems.</p>\n\n<p>1. The way that we\
            \ select an available partition has a bug. We return the index of the\
            \ partition. However, since partitions are not sorted, the index may not\
            \ match the actual partition.<br/>\nfor (int i = 0; i &lt; numPartitions;\
            \ i++) {<br/>\n    int partition = Utils.abs(counter.getAndIncrement())\
            \ % numPartitions;<br/>\n    if (partitions.get(partition).leader() !=\
            \ null) {<br/>\n        return partition; --&gt; should be changed to\
            \ return the actual<br/>\n2. The way that we use counter in Partitioner\
            \ may cause an unavailable partition to be selected when there are concurrent\
            \ threads producing data to the same producer instance.</p>\n\n<p>Attaching\
            \ a patch.</p>"
          '@author': junrao
          '@created': Tue, 24 Feb 2015 17:43:32 +0000
          '@id': '14335142'
        - '#text': "<p>Created reviewboard <a href=\"https://reviews.apache.org/r/31367/diff/\"\
            \ class=\"external-link\" target=\"_blank\" rel=\"nofollow noopener\"\
            >https://reviews.apache.org/r/31367/diff/</a><br/>\n against branch origin/0.8.2</p>"
          '@author': junrao
          '@created': Tue, 24 Feb 2015 18:16:26 +0000
          '@id': '14335183'
        - '#text': <p>Attaching a fix for 0.8.2 too.</p>
          '@author': junrao
          '@created': Tue, 24 Feb 2015 18:16:47 +0000
          '@id': '14335184'
        - '#text': <p>Marking this a blocker for 0.8.2.1 since it affects the use
            case where replication factor is 1.</p>
          '@author': junrao
          '@created': Tue, 24 Feb 2015 21:46:01 +0000
