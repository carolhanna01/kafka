      description: '<p>This appears to be a regression caused by the KIP-62 patch.
        It is possible that we end up blocking unnecessarily in <tt>NetworkClient.poll()</tt>
        with no requests pending. The reason is that <tt>ConsumerNetworkClient.poll(RequestFuture)</tt>
        does not actually verify that the request has been sent prior to calling <tt>NetworkClient.poll()</tt>.
        This was not as much of a problem previously because the maximum timeout was
        always bounded by the heartbeat interval, which is typically small.</p>


        <p>This appears to be the cause of hanging builds that some people may have
        experienced. In particular, I have seen <tt>ConsumerBounceTest</tt> hang because
        of this problem.</p>


        <p>Note that another reason we can block indefinitely in <tt>commitSync()</tt>
        is coordinator discovery. We do not attempt to fix this here.</p>'
