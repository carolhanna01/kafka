      description: "<p>Kafka's log implementation serializes all writes using a lock,\
        \ but allows multiple concurrent reads while that lock is held. The `FileRecords`\
        \ class contains the core implementation. Reads to the log create logical\
        \ slices of `FileRecords` which are then passed to the network layer for sending.\
        \ An abridged version of the implementation of `slice` is provided below:</p>\n\
        \n<div class=\"code panel\" style=\"border-width: 1px;\"><div class=\"codeContent\
        \ panelContent\">\n<pre class=\"code-java\">\n    <span class=\"code-keyword\"\
        >public</span> FileRecords slice(<span class=\"code-object\">int</span> position,\
        \ <span class=\"code-object\">int</span> size) <span class=\"code-keyword\"\
        >throws</span> IOException {\n        <span class=\"code-object\">int</span>\
        \ end = <span class=\"code-keyword\">this</span>.start + position + size;\n\
        \        <span class=\"code-comment\">// handle integer overflow or <span\
        \ class=\"code-keyword\">if</span> end is beyond the end of the file\n</span>\
        \        <span class=\"code-keyword\">if</span> (end &lt; 0 || end &gt;= start\
        \ + sizeInBytes())\n            end = start + sizeInBytes();\n        <span\
        \ class=\"code-keyword\">return</span> <span class=\"code-keyword\">new</span>\
        \ FileRecords(file, channel, <span class=\"code-keyword\">this</span>.start\
        \ + position, end, <span class=\"code-keyword\">true</span>);\n    }\n</pre>\n\
        </div></div>\n\n<p>The `size` parameter here is typically derived from the\
        \ fetch size, but is upper-bounded with respect to the high watermark. The\
        \ two calls to `sizeInBytes` here are problematic because the size of the\
        \ file may change in between them. Specifically a concurrent write may increase\
        \ the size of the file after the first call to `sizeInBytes` but before the\
        \ second one. In the worst case, when `size` defines the limit of the high\
        \ watermark, this can lead to a slice containing uncommitted data.</p>"
