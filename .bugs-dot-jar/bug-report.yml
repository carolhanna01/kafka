          '@id': '15576402'
        - '#text': <p>Revised the title. The unnecessary blocking caused by the issue
            above should be bounded in duration by the minimum of <tt>metadata.max.age.ms</tt>
            and <tt>request.timeout.ms</tt> (this upper bound is enforced by <tt>NetworkClient</tt>).
            We still probably need to fix this though because it prevents the offset
            commit from being sent and results in the consumer being kicked out of
            the group.</p>
          '@author': hachikuji
          '@created': Fri, 14 Oct 2016 21:19:50 +0000
          '@id': '15576520'
