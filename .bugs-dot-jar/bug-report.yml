      description: '<p>Prefix ACLs may shadow other prefix ACLs. Consider the case
        where we have prefix ACLs for foobar, fooa, and f. If we were matching a resource
        named "foobar", we''d start scanning at the foobar ACL, hit the fooa ACL,
        and stop &#8211; missing the f ACL.</p>


        <p>To fix this, we should re-scan for ACLs at the first divergence point (in
        this case, f) whenever we hit a mismatch of this kind.</p>'
