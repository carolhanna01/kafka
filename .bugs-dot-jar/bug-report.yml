            _blank\" rel=\"nofollow noopener\">https://github.com/apache/kafka/pull/5241</a></p>\n\
            \n\n\n\n<p>This is a PR merged from a forked repository.<br/>\nAs GitHub\
            \ hides the original diff on merge, it is displayed below for<br/>\nthe\
            \ sake of provenance:</p>\n\n<p>As this is a foreign pull request (from\
            \ a fork), the diff is supplied<br/>\nbelow (as it won't show otherwise\
            \ due to GitHub magic):</p>\n\n<p>diff --git a/clients/src/main/java/org/apache/kafka/common/config/ConfigTransformer.java\
            \ b/clients/src/main/java/org/apache/kafka/common/config/ConfigTransformer.java<br/>\n\
            index 7c3c516b073..c727230e137 100644<br/>\n&#8212; a/clients/src/main/java/org/apache/kafka/common/config/ConfigTransformer.java<br/>\n\
            +++ b/clients/src/main/java/org/apache/kafka/common/config/ConfigTransformer.java<br/>\n\
            @@ -77,11 +77,13 @@ public ConfigTransformerResult transform(Map&lt;String,\
            \ String&gt; configs) {</p>\n\n<p>         // Collect the variables from\
            \ the given configs that need transformation<br/>\n         for (Map.Entry&lt;String,\
            \ String&gt; config : configs.entrySet()) {</p>\n<ul class=\"alternate\"\
            \ type=\"square\">\n\t<li>List&lt;ConfigVariable&gt; vars = getVars(config.getKey(),\
            \ config.getValue(), DEFAULT_PATTERN);</li>\n\t<li>for (ConfigVariable\
            \ var : vars) {</li>\n\t<li>Map&lt;String, Set&lt;String&gt;&gt; keysByPath\
            \ = keysByProvider.computeIfAbsent(var.providerName, k -&gt; new HashMap&lt;&gt;());</li>\n\
            \t<li>Set&lt;String&gt; keys = keysByPath.computeIfAbsent(var.path, k\
            \ -&gt; new HashSet&lt;&gt;());</li>\n\t<li>keys.add(var.variable);<br/>\n\
            +            if (config.getValue() != null) \n<div class=\"error\"><span\
            \ class=\"error\">Unknown macro: {+                List&lt;ConfigVariable&gt;\
            \ vars = getVars(config.getKey(), config.getValue(), DEFAULT_PATTERN);+\
            \                for (ConfigVariable var }</span> </div>\n<p>        \
            \ }</p></li>\n</ul>\n\n\n<p>@@ -128,6 +130,9 @@ public ConfigTransformerResult\
            \ transform(Map&lt;String, String&gt; configs) {<br/>\n     private static\
            \ String replace(Map&lt;String, Map&lt;String, Map&lt;String, String&gt;&gt;&gt;\
            \ lookupsByProvider,<br/>\n                                   String value,<br/>\n\
            \                                   Pattern pattern) {<br/>\n+       \
            \ if (value == null) </p>\n{\n+            return null;\n+        }\n\
            <p>         Matcher matcher = pattern.matcher(value);<br/>\n         StringBuilder\
            \ builder = new StringBuilder();<br/>\n         int i = 0;<br/>\ndiff\
            \ --git a/clients/src/test/java/org/apache/kafka/common/config/ConfigTransformerTest.java\
            \ b/clients/src/test/java/org/apache/kafka/common/config/ConfigTransformerTest.java<br/>\n\
            index 7bc74f36e9b..ebc401180f2 100644<br/>\n&#8212; a/clients/src/test/java/org/apache/kafka/common/config/ConfigTransformerTest.java<br/>\n\
            +++ b/clients/src/test/java/org/apache/kafka/common/config/ConfigTransformerTest.java<br/>\n\
            @@ -25,6 +25,7 @@<br/>\n import java.util.Set;</p>\n\n<p> import static\
            \ org.junit.Assert.assertEquals;<br/>\n+import static org.junit.Assert.assertNull;<br/>\n\
            \ import static org.junit.Assert.assertTrue;</p>\n\n<p> public class ConfigTransformerTest\
            \ {<br/>\n@@ -36,6 +37,7 @@<br/>\n     public static final String TEST_PATH\
            \ = \"testPath\";<br/>\n     public static final String TEST_RESULT =\
            \ \"testResult\";<br/>\n     public static final String TEST_RESULT_WITH_TTL\
            \ = \"testResultWithTTL\";<br/>\n+    public static final String TEST_RESULT_NO_PATH\
            \ = \"testResultNoPath\";</p>\n\n<p>     private ConfigTransformer configTransformer;</p>\n\
            \n<p>@@ -83,6 +85,24 @@ public void testSingleLevelOfIndirection() throws\
            \ Exception {<br/>\n         assertEquals(\"${test:testPath:testResult}\"\
            , data.get(MY_KEY));<br/>\n     }</p>\n\n<p>+    @Test<br/>\n+    public\
            \ void testReplaceVariableNoPath() throws Exception {<br/>\n+        ConfigTransformerResult\
            \ result = configTransformer.transform(Collections.singletonMap(MY_KEY,\
            \ \"${test:testKey}\"));<br/>\n+        Map&lt;String, String&gt; data\
            \ = result.data();<br/>\n+        Map&lt;String, Long&gt; ttls = result.ttls();<br/>\n\
            +        assertEquals(TEST_RESULT_NO_PATH, data.get(MY_KEY));<br/>\n+\
            \        assertTrue(ttls.isEmpty());<br/>\n+    }<br/>\n+<br/>\n+    @Test<br/>\n\
            +    public void testNullConfigValue() throws Exception </p>\n{\n+   \
            \     ConfigTransformerResult result = configTransformer.transform(Collections.singletonMap(MY_KEY,\
            \ null));\n+        Map&lt;String, String&gt; data = result.data();\n\
            +        Map&lt;String, Long&gt; ttls = result.ttls();\n+        assertNull(data.get(MY_KEY));\n\
            +        assertTrue(ttls.isEmpty());\n+    }\n<p>+<br/>\n     public static\
            \ class TestConfigProvider implements ConfigProvider {</p>\n\n<p>    \
            \     public void configure(Map&lt;String, ?&gt; configs) {<br/>\n@@ -95,7\
            \ +115,7 @@ public ConfigData get(String path) {<br/>\n         public\
            \ ConfigData get(String path, Set&lt;String&gt; keys) {<br/>\n       \
