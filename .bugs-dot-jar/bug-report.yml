            \             Long ttl = null;</p>\n<ul class=\"alternate\" type=\"square\"\
            >\n\t<li>if (path.equals(TEST_PATH)) {<br/>\n+            if (TEST_PATH.equals(path))\
            \ {<br/>\n                 if (keys.contains(TEST_KEY)) \n{\n        \
            \             data.put(TEST_KEY, TEST_RESULT);\n                 }\n<p>@@\
